name: Deployment Pipeline (.NET API to Vercel)
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
 
jobs:
 
  avoid_redundancy:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Redundant Builds
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
 
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
 
      - name: Restore dependencies
        run: dotnet restore Fast-api.csproj
 
      - name: Build project
        run: dotnet build Fast-api.csproj --configuration Release --no-restore
 
      - name: Publish for deployment
        run: dotnet publish Fast-api.csproj -c Release -o ./publish
 
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-publish
          path: publish
 
  # test:
  #   needs: [build]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
 
  #     - name: Setup .NET
  #       uses: actions/setup-dotnet@v4
  #       with:
  #         dotnet-version: '8.0.x'
 
  #     - name: Restore dependencies
  #       run: dotnet restore Fast-api.csproj
 
  #     - name: Run tests
  #       run: dotnet test Fast-api.csproj --no-build --verbosity normal
 
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-publish
          path: publish
 
      - name: Install Vercel CLI
        run: npm install -g vercel
 
      - name: Deploy .NET API to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}